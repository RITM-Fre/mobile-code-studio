
name: Android APK Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Build Mobile Code Studio
    runs-on: ubuntu-latest

    steps:
      # دریافت سورس پروژه
      - name: Checkout
        uses: actions/checkout@v4

      # نصب Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # نصب نسخه Gradle مورد نیاز پروژه
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ساخت APK دیباگ
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      # آپلود APK دیباگ
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileCodeStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # بررسی وجود کلید امضای Release
      - name: Check Signing Secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] &&
             [ -n "$STORE_PASS" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured. Skipping signed release."
          fi

      # استخراج Keystore
      - name: Prepare Release Keystore
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="${RUNNER_TEMP}/release-keystore.jks"

          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      # ساخت APK امضاشده
      - name: Build Signed Release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            --no-daemon \
            --init-script .github/ci-signing.init.gradle

      # بررسی امضای APK
      - name: Verify Release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK not found!"
            exit 1
          fi

          cp "$APK" MobileCodeStudio-release.apk

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose \
            MobileCodeStudio-release.apk

      # آپلود APK نسخه Release
      - name: Upload Release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MobileCodeStudio-Release-APK
          path: MobileCodeStudio-release.apk
          if-no-files-found: error
          retention-days: 90

      # انتشار نسخه در GitHub Releases
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Mobile Code Studio ${{ github.ref_name }}
          body: |
            Mobile Code Studio - Signed Android Release

            Version: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

          files: MobileCodeStudio-release.apk
          draft: false
          prerelease: false

      # پاک کردن کلید موقت
      - name: Cleanup
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release-keystore.jks"
